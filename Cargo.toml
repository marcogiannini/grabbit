[package]
name = "grabbit"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
description = "Scarica video e musica da YouTube e Spotify con yt-dlp, con interfaccia grafica semplice"
license = "MIT"
# IMPORTANTE: metti qui l'URL del tuo repository GitHub. L'aggiornamento
# automatico dell'app legge le release da questo repository.
repository = "https://github.com/OWNER/grabbit"
build = "build.rs"

[dependencies]
# GUI leggera: renderer "glow" (OpenGL) al posto del più pesante wgpu
eframe = { version = "0.37", default-features = false, features = [
    "glow", "default_fonts", "clipboard", "wayland", "x11",
] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

# rete, dati, errori
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "6"
semver = "1"
self-replace = "1"
# estrazione di ffmpeg e Deno (zip) e di ffmpeg su Linux (tar.xz)
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
