name: Windows exe

# Compila solo l'eseguibile Windows, senza pubblicare nulla.
# Su GitHub: Actions -> "Windows exe" -> Run workflow -> a fine lavoro
# scarica "grabbit-windows" dalla sezione Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "Cargo.toml", "Cargo.lock", "build.rs", "assets/**"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - run: copy target\release\grabbit.exe grabbit-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: grabbit-windows
          path: grabbit-windows-x86_64.exe
